</head>
<body>
  <a class="skip" href="#app">Pular para o conteúdo</a>

  <header class="topbar">
    <div class="tb-in">
      <a class="tb-brand" href="#inicio" aria-label="Vértora — início">
        <img src="assets/vertora-v-1x.png" srcset="assets/vertora-v-2x.png 2x" width="34" height="24" alt="">
        <span class="tb-word">VÉRTORA</span>
      </a>
      <p class="tb-where" aria-live="polite"></p>
      <div class="tb-actions">
        <button type="button" class="icon-btn icon-btn--light" data-action="share" aria-label="Compartilhar">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
        </button>
        <button type="button" class="icon-btn icon-btn--light" data-action="qr" aria-label="Mostrar QR Code">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
        </button>
      </div>
    </div>
    <div class="tb-progress" aria-hidden="true"><span></span></div>
  </header>

  <main id="app" tabindex="-1"></main>

  <button type="button" class="fab" data-action="toc" aria-haspopup="dialog">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></svg>
    Sumário
  </button>

  <dialog id="toc" class="sheet" aria-labelledby="toc-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="toc-title">Sumário</h2>
      <button type="button" class="icon-btn" data-action="close" aria-label="Fechar sumário">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <nav aria-label="Capítulos">
      <a class="toc-quick" href="#inicio">Início</a>
      <a class="toc-quick" href="#60s">Vértora em 60 segundos</a>
      <ol id="toc-list" class="toc"></ol>
    </nav>
    <div class="sheet-actions">
      <button type="button" class="btn btn--ghost btn--sm" data-action="share">Compartilhar</button>
      <button type="button" class="btn btn--ghost btn--sm" data-action="qr">QR Code</button>
      <a id="toc-pdf" class="btn btn--ghost btn--sm" href="#" download>Baixar PDF</a>
    </div>
  </dialog>

  <dialog id="person" class="sheet" aria-labelledby="person-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head sheet-head--end">
      <button type="button" class="icon-btn" data-action="close" aria-label="Fechar">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="ps-body"></div>
  </dialog>

  <dialog id="qr" class="qr-modal" aria-labelledby="qr-title">
    <div class="qr-in">
      <button type="button" class="icon-btn qr-close" data-action="close" aria-label="Fechar QR Code">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <p class="kicker">Vértora · Portfólio</p>
      <h2 id="qr-title">Aponte a câmera do celular</h2>
      <img id="qr-img" alt="QR Code que abre o portfólio da Vértora" width="320" height="320">
      <p id="qr-url" class="qr-url"></p>
    </div>
  </dialog>

  <div id="stories" class="stories" hidden role="dialog" aria-modal="true" aria-label="Vértora em 60 segundos">
    <div class="st-top">
      <div class="st-segs" aria-hidden="true">
        <span class="sg"><span></span></span><span class="sg"><span></span></span><span class="sg"><span></span></span><span class="sg"><span></span></span><span class="sg"><span></span></span><span class="sg"><span></span></span><span class="sg"><span></span></span>
      </div>
      <div class="st-bar">
        <span class="st-brand"><img src="assets/vertora-v-1x.png" srcset="assets/vertora-v-2x.png 2x" width="28" height="20" alt="">Vértora em 60 segundos</span>
        <button type="button" class="st-skip">Pular</button>
        <button type="button" class="icon-btn icon-btn--light st-close" aria-label="Fechar">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="st-slide"></div>
    <p class="st-help" aria-hidden="true">Toque à direita para avançar · à esquerda para voltar · segure para pausar</p>
  </div>

  <div id="refpop" class="refpop" role="dialog" aria-label="Referência" hidden>
    <div class="rp-head"><p class="rp-title"></p>
      <button type="button" class="icon-btn icon-btn--sm rp-close" aria-label="Fechar referência">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button></div>
    <p class="rp-text"></p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">Ative o JavaScript para navegar pelo portfólio, ou <a href="assets/Vertora_Portfolio_Juridico_Digital.pdf">baixe o PDF</a>.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
